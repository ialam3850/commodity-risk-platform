name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: git ls-files --error-unmatch README.md LICENSE THIRD_PARTY_NOTICES.md .gitignore .clang-format

