name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: git ls-files --error-unmatch README.md LICENSE THIRD_PARTY_NOTICES.md .gitignore .clang-format

  pricing-core:
    name: C++ pricing core (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [release, sanitize]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build python3-dev
      - name: Configure
        run: |
          extra=""
          if [ "${{ matrix.config }}" = "sanitize" ]; then extra="-DCMAKE_BUILD_TYPE=Debug -DPC_SANITIZE=ON -DPC_BUILD_PYTHON=OFF"; fi
          cmake -S pricing-core -B pricing-core/build -G Ninja -DPC_BUILD_PYTHON=OFF $extra
      - run: cmake --build pricing-core/build
      - run: ctest --test-dir pricing-core/build --output-on-failure

  ledger-service:
    name: Java ledger service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start PostgreSQL in Docker via Testcontainers.
      - run: cd ledger-service && ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: ledger-service/target/*-reports/

  research:
    name: Python research
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r research/requirements.txt
      - run: cd research && python -m unittest discover -s tests -v
      - name: Backtest runs on the committed data
        run: python research/scripts/run_backtest.py

